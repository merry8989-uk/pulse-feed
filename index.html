<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pulse — post karo, dekho, like karo</title>
<style>
  :root{
    --bg:#0e1014; --bg2:#14171d; --card:#181b22; --card2:#1f232c;
    --text:#e9ecf3; --muted:#8b93a7; --border:#272c37;
    --accent:#7c5cff; --accent-soft:#2a2350; --green:#22c55e; --pink:#ec4899; --danger:#ef4444;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -200px, #1b1740 0%, var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; line-height:1.5;
  }
  a{color:var(--accent);text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px 90px}
  header{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(14,16,20,.78);border-bottom:1px solid var(--border)}
  .hrow{max-width:640px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:12px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.3px}
  .logo .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--pink));display:grid;place-items:center;font-size:15px}
  .hspacer{flex:1}
  .avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:0 0 auto;font-size:15px;border:1px solid rgba(255,255,255,.08);overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .avatar.lg{width:64px;height:64px;font-size:24px}
  .avatar.sm{width:30px;height:30px;font-size:12px}
  .btn{border:1px solid var(--border);background:var(--card2);color:var(--text);padding:9px 14px;border-radius:11px;font-weight:600;font-size:14px;transition:.15s}
  .btn:hover{background:#262b36;border-color:#39404e}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#6a4bf0}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
  .btn.block{width:100%;justify-content:center;display:flex;padding:12px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:14px 0}
  .hero{text-align:center;padding:34px 8px 6px}
  .hero h1{font-size:30px;margin:14px 0 6px;letter-spacing:-.6px}
  .hero p{color:var(--muted);margin:0 auto;max-width:420px}
  .tabs{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--border);padding:5px;border-radius:12px;margin:16px 0}
  .tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);border:none;background:transparent}
  .tab.active{background:var(--card2);color:var(--text)}
  label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
  input,textarea,select{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:11px;font-size:15px;font-family:inherit;outline:none}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:74px}
  .composer .ctabs{display:flex;gap:8px;margin-bottom:10px}
  .chip{padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);font-size:13px;font-weight:600}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:#c9bcff}
  .preview{margin-top:10px;position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border);display:none}
  .preview img,.preview video{width:100%;display:block;max-height:360px;object-fit:cover;background:#000}
  .preview .x{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:16px}
  .crow{display:flex;align-items:center;gap:10px;margin-top:12px}
  .file-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px dashed var(--border);border-radius:11px;color:var(--muted);font-size:13px;font-weight:600;background:var(--bg2)}
  .file-btn:hover{border-color:var(--accent);color:#c9bcff}
  input[type=file]{display:none}
  .post-head{display:flex;gap:11px;align-items:flex-start}
  .pname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .pmuted{color:var(--muted);font-size:13px}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:#c9bcff;border:1px solid #3a3070}
  .post-body{margin:12px 0 0;white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
  .post-media{margin-top:12px;border-radius:13px;overflow:hidden;border:1px solid var(--border);background:#000}
  .post-media img,.post-media video{width:100%;display:block;max-height:520px;object-fit:contain;background:#000}
  .actions{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  .act{display:flex;align-items:center;gap:6px;background:transparent;border:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:7px 11px;border-radius:10px;transition:.15s}
  .act:hover{background:var(--card2);color:var(--text)}
  .act.liked{color:var(--pink)}
  .comments{margin-top:10px;border-top:1px solid var(--border);padding-top:12px;display:none}
  .comments.open{display:block}
  .citem{display:flex;gap:9px;margin-bottom:10px}
  .cbubble{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:8px 12px;flex:1}
  .cbubble .n{font-weight:700;font-size:13px}
  .cbubble .t{font-size:14px;white-space:pre-wrap;word-wrap:break-word}
  .cform{display:flex;gap:8px;margin-top:6px}
  .cform input{flex:1}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .empty .big{font-size:40px;margin-bottom:8px}
  .pcover{height:96px;border-radius:16px 16px 0 0;background:linear-gradient(120deg,#7c5cff,#ec4899)}
  .pcard{margin-top:-40px;padding:0 16px 16px}
  .pmeta{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
  .pstats{display:flex;gap:18px;margin-top:14px;color:var(--muted);font-size:13.5px}
  .pstats b{color:var(--text);font-size:16px;display:block}
  .tabsline{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:16px 0 0}
  .tabsline button{background:transparent;border:none;color:var(--muted);padding:11px 14px;font-weight:600;font-size:14px;border-bottom:2px solid transparent}
  .tabsline button.active{color:var(--text);border-bottom-color:var(--accent)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#20242e;border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:150;padding:16px}
  .modal.show{display:grid}
  .modal .box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:400px}
  .note{font-size:12.5px;color:var(--muted);background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-top:12px}
  .linkbtn{background:none;border:none;color:var(--accent);font-weight:600;font-size:13.5px;padding:0}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:14px;margin:14px 0 0}
  .setup code{background:var(--bg2);border:1px solid var(--border);padding:2px 6px;border-radius:6px;font-size:13px}
  .setup ol{padding-left:20px}
  .setup li{margin:6px 0}
  /* carousel */
  .carousel{position:relative}
  .carousel .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none}
  .carousel .track::-webkit-scrollbar{display:none}
  .carousel .slide{min-width:100%;scroll-snap-align:center}
  .carousel .slide img{width:100%;display:block;max-height:520px;object-fit:contain;background:#000}
  .carousel .dots{position:absolute;bottom:8px;left:0;right:0;display:flex;gap:6px;justify-content:center;pointer-events:none}
  .carousel .dots .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
  .carousel .dots .dot.on{background:#fff}
  .carousel .counter{position:absolute;top:8px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px}
  /* pdf card */
  .pdfcard{display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--bg2);margin-top:12px;border-radius:13px;border:1px solid var(--border)}
  .pdfcard .pdf-preview{width:100%;border-radius:10px;overflow:hidden;background:#0b0d11;display:flex;align-items:center;justify-content:center;min-height:150px;max-height:440px}
  .pdfcard .pdf-preview canvas{max-width:100%;max-height:440px;display:block}
  .pdfcard .pdf-row{display:flex;align-items:center;gap:12px}
  .pdfcard .pdf-ico{font-size:26px;line-height:1}
  .pdfcard .pdf-meta{flex:1;display:flex;flex-direction:column}
  .pdfcard .pdf-meta b{font-size:14px}
  .pdfcard .pdf-meta span{font-size:12.5px;color:var(--muted)}
  /* composer preview grid */
  .preview .thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px}
  .preview .thumbs img{width:92px;height:92px;object-fit:cover;border-radius:8px;flex:0 0 auto}
  .preview .thumbs .pchip{display:flex;align-items:center;gap:8px;padding:10px;background:var(--bg2);border-radius:8px;font-size:13px}
  /* pdf reader overlay */
  .reader{position:fixed;inset:0;background:#0b0d11;z-index:300;display:none;flex-direction:column}
  .reader.show{display:flex}
  .reader-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .reader-title{flex:1;font-weight:700;font-size:15px;text-align:center}
  .reader-count{font-size:13px;color:var(--muted);font-weight:600;min-width:54px;text-align:right}
  .reader-body{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:12px;-webkit-overflow-scrolling:touch}
  .pdf-canvas{max-width:100%;height:auto;border-radius:8px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .pdf-frame{width:100%;min-height:70vh;border:0;border-radius:8px;background:#fff}
  .preview .pdfthumb canvas{max-width:110px;border-radius:8px;display:block}
  .reader-nav{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--border)}
  .reader-nav .btn{flex:1;justify-content:center;display:flex}
  /* settings + diagnostics */
  .setrow{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-top:12px}
  .switch{width:56px;height:32px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);position:relative;flex:0 0 auto;transition:.15s;padding:0}
  .switch span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#8b93a7;transition:.15s}
  .switch.on{background:var(--accent-soft);border-color:var(--accent)}
  .switch.on span{left:28px;background:var(--accent)}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .dgrid .btn{justify-content:center;display:flex}
  .kv div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
  .kv div:last-child{border-bottom:none}
  .kv span{color:var(--muted);word-break:break-word}
  .kv b{text-align:right;word-break:break-word;font-weight:600}
  .logbox{max-height:340px;overflow:auto;background:#0b0d11;border:1px solid var(--border);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.65}
  .logline{white-space:pre-wrap;word-break:break-word;color:#c7cbd6}
  .logline.error{color:#ff9d9d}
  .logline.warn{color:#ffd479}
  .logline.debug{color:#8b93a7}
  .logline .lt{color:#6b7280}
  .logline .lv{color:#7c5cff;font-weight:700}
  .logline.error .lv{color:#ef4444}
  .logline .ld{color:#8b93a7}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <a class="logo" href="#/feed" data-go="#/feed" style="color:inherit" aria-label="Pulse home"><span class="dot">⚡</span> Pulse</a>
    <div class="hspacer"></div>
    <div id="hauth"></div>
  </div>
</header>
<main id="app" class="wrap"></main>
<div class="toast" id="toast"></div>

<div class="modal" id="editModal">
  <div class="box">
    <h3 style="margin:0 0 4px">Edit profile</h3>
    <label class="f">Display name</label>
    <input id="edName" maxlength="40" />
    <label class="f">Bio</label>
    <textarea id="edBio" maxlength="160" style="min-height:60px"></textarea>
    <label class="f">Avatar emoji</label>
    <input id="edEmoji" maxlength="3" />
    <div class="crow">
      <button class="btn primary block" id="edSave">Save</button>
      <button class="btn block" id="edCancel">Cancel</button>
    </div>
  </div>
</div>

<!-- PDF.js (page rendering + swipe reader) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- PDF reader overlay -->
<div class="reader" id="pdfReader">
  <div class="reader-top">
    <button class="btn sm ghost" id="pdfClose" aria-label="Close">✕</button>
    <div class="reader-title">PDF</div>
    <div class="reader-count"><span id="pdfPage">1</span> / <span id="pdfCount">–</span></div>
  </div>
  <div class="reader-body" id="pdfCanvasWrap"></div>
  <div class="reader-nav">
    <button class="btn" id="pdfPrev">‹ Prev</button>
    <button class="btn" id="pdfNext">Next ›</button>
  </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ============================================================
   CONFIG  ←  YAHAN apni Supabase details daalo
   Supabase dashboard -> Project Settings -> API
   ============================================================ */
const SUPABASE_URL      = "https://naimlzavtlytnrqixffm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5haW1semF2dGx5dG5ycWl4ZmZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MDY5MjUsImV4cCI6MjEwNzQ4MjkyNX0.SYTvTDvH7SCJ73kgKXhPEGSkU6zsG9oVOyjRcOFXUPE";
/* ============================================================ */

const CONFIGURED = SUPABASE_URL.startsWith("http") && !SUPABASE_URL.includes("YOUR_")
                   && SUPABASE_ANON_KEY.length > 20 && !SUPABASE_ANON_KEY.includes("YOUR_");
const sb = CONFIGURED ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ---------- helpers ---------- */
const esc = (s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS = ["#7c5cff","#ec4899","#22c55e","#f59e0b","#06b6d4","#ef4444","#8b5cf6","#14b8a6"];
const colorFor = (id)=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length];};
function timeAgo(ts){
  const s = Math.floor((Date.now()-new Date(ts).getTime())/1000);
  if(s<60) return "abhi";
  if(s<3600) return Math.floor(s/60)+"m";
  if(s<86400) return Math.floor(s/3600)+"h";
  if(s<604800) return Math.floor(s/86400)+"d";
  return new Date(ts).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2600);
}
function avatarHTML(u,size=""){
  const cls="avatar"+(size?" "+size:"");
  if(!u) return `<div class="${cls}" style="background:#444">?</div>`;
  if(u.emoji) return `<div class="${cls}" style="background:${colorFor(u.id)}">${esc(u.emoji)}</div>`;
  const initial=(u.name?u.name.trim()[0]:"?").toUpperCase();
  return `<div class="${cls}" style="background:${colorFor(u.id)}">${esc(initial)}</div>`;
}
function anonTag(){
  const a=["Fox","Panda","Owl","Wolf","Tiger","Koala","Lynx","Raven","Otter","Hawk"];
  return a[Math.floor(Math.random()*a.length)]+" #"+Math.floor(1000+Math.random()*9000);
}

/* ============================================================
   DIAGNOSTICS — v4 · ProGallery shared event schema
   Envelope fields on every event:
   event_name, schema_version, timestamp, session_id, attempt_id,
   user_id, platform, app_version, os, device_model, network_type,
   screen_or_route, log_level, release_channel
   ============================================================ */
const DIAG_EMAIL = "br19shc39@gmail.com";
const DIAG_KEY = "pulse_diag";
const DIAG_LOGS_KEY = "pulse_diag_logs";
const DIAG_SALT_KEY = "pulse_diag_salt";
const SCHEMA_VERSION = "1.0.0";
const APP_VERSION = "4.0.0";
const RELEASE_CHANNEL = /[?&]beta=1/.test(location.search) ? "beta" : "production";
const DIAG_RETENTION = { error:30, warn:14, info:7, debug:1 };   /* days, per log class */
const DIAG_MAX = 1200;
/* Notion sink (automatic + silent) — Supabase Edge Function. Pehle se set hai; user ko kuch nahi batana. */
const NOTION_SINK_URL = "https://naimlzavtlytnrqixffm.supabase.co/functions/v1/notion-sink";

/* ---- privacy: identical redaction rules everywhere ---- */
const REDACT_RULES = [
  [/[\w.+-]+@[\w-]+\.[\w.-]{2,}/g, "[email]"],
  [/\+?\d[\d\s().-]{7,}\d/g, "[phone]"],
  [/eyJ[\w-]{8,}\.[\w-]{8,}\.[\w-]{6,}/g, "[token]"],
  [/\b(?:sk|pk|rk|api|secret|token|apikey|access)[_-][A-Za-z0-9]{8,}\b/gi, "[key]"],
  [/([?&](?:token|key|apikey|access_token|code|password)=)[^&\s]+/gi, "$1[redacted]"],
  [/\b[\w-]+\.(?:jpe?g|png|gif|webp|mp4|mov|webm|pdf|docx?|xlsx?)\b/gi, "[filename]"],
  [/\b(?:\/[\w.\-]+){3,}/g, "[path]"]
];
function redact(v){
  if(v==null) return v;
  let s=String(v);
  for(const [re,to] of REDACT_RULES){ try{ s=s.replace(re,to); }catch(e){} }
  return s.slice(0,600);
}
function redactData(d){
  if(d==null) return d;
  if(typeof d==="string") return redact(d);
  if(typeof d==="number"||typeof d==="boolean") return d;
  if(Array.isArray(d)) return d.slice(0,50).map(redactData);
  if(typeof d==="object"){ const o={}; for(const k of Object.keys(d).slice(0,40)) o[k]=redactData(d[k]); return o; }
  return redact(String(d));
}
function hostOnly(u){ try{ return new URL(u, location.href).host; }catch(e){ return redact(u); } }
function parseUA(){
  const ua=navigator.userAgent;
  let os="unknown", model="desktop";
  if(/Windows NT 10/.test(ua)) os="Windows 10/11";
  else if(/Windows/.test(ua)) os="Windows";
  else if(/Android ([\d.]+)/.test(ua)){ os="Android "+RegExp.$1; model="Android device"; }
  else if(/iPhone|iPod/.test(ua)){ os="iOS"; model="iPhone"; }
  else if(/iPad/.test(ua)){ os="iPadOS"; model="iPad"; }
  else if(/Mac OS X/.test(ua)) os="macOS";
  else if(/Linux/.test(ua)) os="Linux";
  let b="unknown";
  if(/Edg\//.test(ua)) b="Edge"; else if(/OPR\//.test(ua)) b="Opera"; else if(/Chrome\//.test(ua)) b="Chrome"; else if(/Firefox\//.test(ua)) b="Firefox"; else if(/Safari\//.test(ua)) b="Safari";
  return { os: os+" / "+b, device_model: model };
}
function networkType(){
  if(!navigator.onLine) return "offline";
  const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection||{};
  const t=String(c.effectiveType||"");
  if(t.indexOf("4g")>=0) return "4g";
  if(t.indexOf("3g")>=0) return "3g";
  if(t.indexOf("2g")>=0) return "2g";
  return c.type==="wifi" ? "wifi" : "unknown";
}

/* ---- session context: captured ONCE per session ---- */
const UA = parseUA();
const SESSION = { id:"sess_"+Math.random().toString(36).slice(2,10), startedAt:new Date().toISOString(), startedMs:Date.now(), context:null };
(function captureContext(){
  const nav=navigator;
  let storage=false; try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); storage=true; }catch(e){}
  SESSION.context = {
    session_id: SESSION.id, started_at: SESSION.startedAt, schema_version: SCHEMA_VERSION,

/* ---- pseudonymous user id: salted SHA-256 (never the raw id) ---- */
let USER_HASH = null;
async function setUserHash(rawId){
  try{
    let salt = localStorage.getItem(DIAG_SALT_KEY);
    if(!salt){ salt = Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem(DIAG_SALT_KEY, salt); }
    if(!rawId){ USER_HASH=null; return; }
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt+":"+rawId));
    USER_HASH = "u_"+[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,12);
  }catch(e){ USER_HASH=null; }
}

/* ---- envelope + validation ---- */
const ENVELOPE_REQUIRED = ["event_name","schema_version","timestamp","session_id","platform","app_version","os","device_model","network_type","screen_or_route","log_level","release_channel"];
function buildEvent(event_name, log_level, opts){
  opts = opts || {};
  const ev = {
    event_name, schema_version: SCHEMA_VERSION,
    timestamp: new Date().toISOString(),
    session_id: SESSION.id,
    platform: "web", app_version: APP_VERSION,
    os: UA.os, device_model: UA.device_model,
    network_type: networkType(), screen_or_route: screenName(),
    log_level, release_channel: RELEASE_CHANNEL
  };
  if(opts.attempt_id) ev.attempt_id = opts.attempt_id;
  if(USER_HASH) ev.user_id = USER_HASH;
  if(opts.properties && Object.keys(opts.properties).length) ev.properties = redactData(opts.properties);
  return ev;
}
function validateEvent(ev){ return ENVELOPE_REQUIRED.filter(k=> ev[k]===undefined || ev[k]===null || ev[k]===""); }

function dlog(log_level, event_name, opts){
  if(!diag.enabled) return;
  if(diag.sample[log_level]!=null && Math.random()>diag.sample[log_level]) return;
  const ev = buildEvent(event_name, log_level, opts||{});
  const missing = validateEvent(ev);
  if(missing.length){ ev.properties = Object.assign({}, ev.properties, { schema_missing: missing.join(",") }); }
  ev.line = logLine(ev);
  diag.logs.push(ev);
  diag.counters.eventCounts[event_name] = (diag.counters.eventCounts[event_name]||0)+1;
  if(log_level==="error") diag.counters.errors++;
  if(log_level==="warn") diag.counters.warnings++;
  persist();
  if(log_level==="error") notionSendDebounced("error");
}
const dbg  = (e,p)=>dlog("debug", e, p===undefined?{}:{properties:p});
const dinfo= (e,p)=>dlog("info",  e, p===undefined?{}:{properties:p});

function diagError(event, err, props){

}

/* ---- Notion sink: session report → Notion (via secure Edge Function) ---- */
let _notionLast=0, _notionTimer=null;
const NOTION_PAGE_KEY = "pulse_notion_page_";
const NOTION_SENT_KEY = "pulse_notion_sent_";
const NOTION_STATUS_KEY = "pulse_notion_status";
function notionReady(){ return diag.enabled && NOTION_SINK_URL && NOTION_SINK_URL.indexOf("http")===0; }
function notionState(){
  return {
    pageId: localStorage.getItem(NOTION_PAGE_KEY+SESSION.id) || null,
    sent: Number(localStorage.getItem(NOTION_SENT_KEY+SESSION.id)||0) || 0
  };
}
function notionStatus(){ try{ return JSON.parse(localStorage.getItem(NOTION_STATUS_KEY)||"null"); }catch(e){ return null; } }
function setNotionStatus(s){ try{ localStorage.setItem(NOTION_STATUS_KEY, JSON.stringify(s)); }catch(e){} }
async function notionSend(reason, useKeepalive){
  if(!notionReady()) return;
  const st = notionState();
  const full = diagReport();
  const newEvents = full.logs.slice(st.sent);
  if(st.pageId && newEvents.length===0 && reason!=="manual") return;   /* kuch naya nahi */
  const slim = Object.assign({}, full, { logs: [] });                    /* payload halka rakho */
  let payload;
  try{ payload = JSON.stringify({ reason, report: slim, page_id: st.pageId, new_events: newEvents }); }catch(e){ return; }
  const headers = { "Content-Type":"application/json" };
  if(CONFIGURED && SUPABASE_ANON_KEY){ headers["Authorization"]="Bearer "+SUPABASE_ANON_KEY; headers["apikey"]=SUPABASE_ANON_KEY; }
  const attempt = { at:new Date().toISOString(), reason, events:newEvents.length, bytes:payload.length, status:null, ok:false, error:null, response:null };
  const send = (keep) => fetch(NOTION_SINK_URL, { method:"POST", headers, body:payload, keepalive:!!keep });
  let res=null;
  try{ res = await send(useKeepalive); }
  catch(e1){
    /* keepalive + bada body browsers me fail hota hai → bina keepalive dobara try */
    attempt.error = String((e1 && e1.message) || e1);
    try{ res = await send(false); }catch(e2){ attempt.error = String((e2 && e2.message) || e2); setNotionStatus(attempt); return; }
  }
  try{
    attempt.status = res.status;
    const data = await res.json().catch(()=>null);
    attempt.response = data ? (data.error || (data.ok ? "ok" : JSON.stringify(data).slice(0,300))) : null;
    if(res.ok && data && data.ok){
      attempt.ok = true;
      if(data.page_id) localStorage.setItem(NOTION_PAGE_KEY+SESSION.id, data.page_id);
      localStorage.setItem(NOTION_SENT_KEY+SESSION.id, String(full.logs.length));
    }
  }catch(e){ attempt.error = "response_read_failed"; }
  setNotionStatus(attempt);
}
function notionSendDebounced(reason, ms){
  if(!notionReady()) return;
  const now=Date.now();
  if(now-_notionLast < (ms||30000)) return;
  _notionLast=now;
  clearTimeout(_notionTimer);
  _notionTimer=setTimeout(()=>notionSend(reason), 1500);
}
/* Automatic + silent — user ko kuch karna nahi hai (koi button/notice nahi). */
setInterval(()=>{ notionSend("periodic"); }, 120000);

/* ---- network capture (api_call: endpoint host + status + latency) ---- */
(function(){
  if(!window.fetch || window.__diagFetch) return;
  window.__diagFetch = true;
  const orig = window.fetch.bind(window);
  window.fetch = async function(input, init){
    const t0=performance.now();
    const url = (typeof input==="string")? input : ((input&&input.url)||"");
    try{
      const res = await orig(input, init);
      const ms = Math.round(performance.now()-t0);
      if(res.status>=400){ diag.counters.apiErrors++; derr("api_call", { endpoint:hostOnly(url), status_code:res.status, latency_ms:ms, ok:false }); }
      else if(ms>3000){ diag.counters.apiSlow++; dwarn("api_call", { endpoint:hostOnly(url), status_code:res.status, latency_ms:ms, slow:true }); }
      return res;
    }catch(e){
      const ms = Math.round(performance.now()-t0);
      diag.counters.apiErrors++;
      derr("api_call", { endpoint:hostOnly(url), status_code:null, latency_ms:ms, ok:false, error_message:(e&&e.message)||"network" });
      throw e;
    }
  };
})();

/* ---- UX signals: rage_click, dead_click, back_button_spam, scroll ---- */
let _rageLock=false, _recentClicks=[], _backs=[], _backLock=false;
function describeTarget(el){
  if(!el || !el.tagName) return "?";
  const id = el.id? "#"+el.id : "";
  const cls = (typeof el.className==="string" && el.className.trim())? "."+el.className.trim().split(/\s+/)[0] : "";
  return el.tagName.toLowerCase()+id+cls;
}
document.addEventListener("click", (e)=>{
  if(!diag.enabled) return;
  const now=Date.now(), x=e.clientX, y=e.clientY;
  _recentClicks.push({t:now,x,y});
  while(_recentClicks.length && now-_recentClicks[0].t>2000) _recentClicks.shift();
  const near=_recentClicks.filter(c=>Math.hypot(c.x-x,c.y-y)<44);
  if(near.length>=3 && !_rageLock){
    _rageLock=true; setTimeout(()=>{ _rageLock=false; },2000);
    diag.counters.rageClicks++;
    dwarn("rage_click", { tap_count:near.length, element:describeTarget(e.target), window_ms:2000 });
  }
  const el = e.target && e.target.closest && e.target.closest("[data-act],[data-go],a,button,input,textarea,select,label,[role=button]");
  if(!el){
    diag.counters.deadClicks++;
    const key=describeTarget(e.target);
    diag.counters.deadClickMap[key]=(diag.counters.deadClickMap[key]||0)+1;
    dbg("dead_click", { element:key });
  }
}, true);
window.addEventListener("popstate", ()=>{
  if(!diag.enabled) return;
  const now=Date.now(); _backs.push(now); _backs=_backs.filter(t=>now-t<2000);
  if(_backs.length>=3 && !_backLock){ _backLock=true; setTimeout(()=>{ _backLock=false; },2000); dwarn("back_button_spam", { press_count:_backs.length, window_ms:2000 }); }
});
window.addEventListener("scroll", ()=>{
  const d=document.documentElement;
  const pct=Math.min(100, Math.round(100*(window.scrollY+window.innerHeight)/Math.max(d.scrollHeight,1)));
  if(pct>diag.maxScroll) diag.maxScroll=pct;
}, {passive:true});

async function capturePermissions(){

function screenName(){ try{ const h=location.hash.replace(/^#/,"")||"/feed"; return h.split("/").filter(Boolean)[0]||"feed"; }catch(e){ return "?"; } }
function logLine(l){
  let s="["+l.timestamp+"] "+String(l.log_level).toUpperCase()+" "+l.event_name;
  if(l.attempt_id) s+=" id="+l.attempt_id;
  const o=l.properties&&l.properties.outcome; if(o) s+=" -> "+o;
  if(l.screen_or_route) s+=" @"+l.screen_or_route;
  if(l.properties!==undefined && l.properties!==null) s+=" :: "+diagDataStr(l.properties);
  return s;
}
function pruneLogs(){
  const now=Date.now();
  diag.logs = diag.logs.filter(l=>{
    const t=Date.parse(l.timestamp); if(isNaN(t)) return true;
    const days = diag.retention[l.log_level]!=null ? diag.retention[l.log_level] : 7;
    return (now-t) <= days*864e5;
  });
  if(diag.logs.length>diag.max) diag.logs=diag.logs.slice(-diag.max);
}
function persist(){ try{ pruneLogs(); localStorage.setItem(DIAG_LOGS_KEY, JSON.stringify(diag.logs)); }catch(e){} }
function diagDataStr(d){ if(d===null||d===undefined) return ""; return typeof d==="string"? d : JSON.stringify(d); }

function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }

  const clipped = body.length>max ? body.slice(0,max)+"\n\n…(poora report Share/Export se bhejo)" : body;
  window.location.href="mailto:"+DIAG_EMAIL+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(clipped);
}

function logPageView(){
  const cur=screenName();

async function ensureProfile(){
  if(!user) return;
  let { data, error } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if(error){ console.error(error); return; }
  if(!data){
    const meta=user.user_metadata||{};
    const isAnon=!!user.is_anonymous;
    const base=(meta.user_name||meta.preferred_username||meta.name||"user").toLowerCase().replace(/[^a-z0-9_]/g,"")||"user";
    const row={ id:user.id, name:isAnon?"Anonymous":(meta.name||meta.full_name||base), handle:base+"_"+user.id.slice(0,4), is_anonymous:isAnon };
    if(isAnon) row.emoji="🕶️";
    const ins=await sb.from("profiles").insert(row).select().single();
    data=ins.data;
  } else if(user.is_anonymous && (!data.name || data.name==="User")){
    const tag=anonTag();
    const upd=await sb.from("profiles").update({ name:"Anonymous", is_anonymous:true, emoji:data.emoji||"🕶️", handle:"anon"+tag.split("#")[1].trim() }).eq("id",user.id).select().single();
    if(upd.data) data=upd.data;
  }
  profile=data;
}

async function loadMyLikes(){
  myLikes=new Set();
  if(!user) return;
  const { data } = await sb.from("likes").select("post_id").eq("user_id", user.id);
  (data||[]).forEach(l=>myLikes.add(l.post_id));

const POST_COLS_BASE = `id, type, text, media_url, created_at,
  author:profiles!posts_author_fkey(id, name, handle, emoji, is_anonymous),
  likes(count), comments(count)`;
const POST_SELECT = `id, type, text, media, media_url, created_at,
  author:profiles!posts_author_fkey(id, name, handle, emoji, is_anonymous),
  likes(count), comments(count)`;

function postsQuery(select, opts={}){
  let q=sb.from("posts").select(select);
  if(opts.author) q=q.eq("author", opts.author);
  return q.order("created_at",{ascending:false}).limit(60);
}
async function fetchPosts(opts={}){
  let res=await postsQuery(POST_SELECT, opts);
  if(res.error && /media/i.test(res.error.message||"")) res=await postsQuery(POST_COLS_BASE, opts);
  return res;
}

async function loadFeed(){
  if(!CONFIGURED) return;
  await loadMyLikes();
  const { data, error } = await fetchPosts();
  if(error){ console.error(error); diagError("feed_load_result", error.message, {outcome:"failed"}); toast("Feed load nahi hua"); return; }
  posts=data||[];
  dinfo("feed_load_result", { outcome:"success", item_count:posts.length });
  markTTFV("feed_loaded");
  render();
}

function mediaItems(p){
  if(Array.isArray(p.media) && p.media.length) return p.media;
  if(p.media_url){
    const kind = p.type==="video" ? "video" : (p.type==="pdf" ? "pdf" : "image");
    return [{url:p.media_url, path:p.media_path, kind}];
  }
  return [];
}
function mediaHTML(p){
  const items=mediaItems(p);
  if(!items.length) return "";
  const imgs=items.filter(i=>i.kind==="image");
  const pdf=items.find(i=>i.kind==="pdf");
  const vid=items.find(i=>i.kind==="video");
  if(pdf) return `<div class="pdfcard">
    <div class="pdf-preview" data-pdfthumb="${esc(pdf.url)}"><span class="pmuted" style="font-size:12px">Preview…</span></div>
    <div class="pdf-row">
      <div class="pdf-ico">📄</div>
      <div class="pdf-meta"><b>PDF document</b><span>Tap karke padho · swipe se pages</span></div>
      <button class="btn primary sm" data-act="open-pdf" data-url="${esc(pdf.url)}">Read PDF</button>
    </div>
  </div>`;
  if(vid) return `<div class="post-media"><video src="${esc(vid.url)}" controls playsinline preload="metadata"></video></div>`;
  if(imgs.length===1) return `<div class="post-media"><img src="${esc(imgs[0].url)}" alt="photo" loading="lazy" /></div>`;
  return `<div class="post-media carousel" data-carousel>
    <div class="track">${imgs.map(i=>`<div class="slide"><img src="${esc(i.url)}" alt="photo" loading="lazy" /></div>`).join("")}</div>
    <div class="counter"><span class="cur">1</span>/${imgs.length}</div>
    <div class="dots">${imgs.map((_,i)=>`<span class="dot ${i===0?"on":""}"></span>`).join("")}</div>
  </div>`;
}

function postHTML(p){
  const u=p.author||{id:"?",name:"Unknown",handle:"unknown"};
  const liked=myLikes.has(p.id);
  const likeCount=p.likes?.[0]?.count||0;
  const cc=p.comments?.[0]?.count||0;
  const nameHTML=u.is_anonymous?`Anonymous <span class="badge">${esc(u.handle||"anon")}</span>`:esc(u.name);
  const del=(user && user.id===u.id)?`<button class="act" data-act="delete" data-id="${p.id}" title="Delete">🗑️</button>`:"";
  const media = mediaHTML(p);
  return `
  <div class="card post" data-post="${p.id}">
    <div class="post-head">
      <button data-go="#/profile/${u.id}" style="border:none;background:none;padding:0">${avatarHTML(u)}</button>
      <div style="flex:1">
        <div class="pname"><button data-go="#/profile/${u.id}" style="border:none;background:none;padding:0;color:inherit;font:inherit">${nameHTML}</button></div>
        <div class="pmuted">@${esc(u.handle||"user")} · ${timeAgo(p.created_at)}</div>
      </div>${del}
    </div>
    ${p.text?`<div class="post-body">${esc(p.text)}</div>`:""}
    ${media}
    <div class="actions">
      <button class="act ${liked?"liked":""}" data-act="like" data-id="${p.id}">${liked?"❤️":"🤍"} <span>${likeCount}</span></button>
      <button class="act" data-act="toggle-comments" data-id="${p.id}">💬 <span>${cc}</span></button>
      <button class="act" data-act="share" data-id="${p.id}">🔗 Share</button>
      <div style="flex:1"></div>
      <button class="act" data-go="#/post/${p.id}">Open</button>
    </div>
    <div class="comments" data-comments="${p.id}">
      <div class="clist"></div>
      ${user?`<div class="cform">
        <input placeholder="Comment likho..." data-cinput="${p.id}" />
        <button class="btn primary sm" data-act="comment" data-id="${p.id}">Send</button></div>`:``}
    </div>
  </div>`;
}

async function loadComments(postId){
  const box=document.querySelector(`[data-comments="${postId}"] .clist`);
  if(!box) return;
  const { data } = await sb.from("comments")
    .select("id, text, created_at, author:profiles!comments_author_fkey(id,name,handle,emoji,is_anonymous)")
    .eq("post_id",postId).order("created_at",{ascending:true}).limit(100);
  const list=data||[];
  box.innerHTML = list.length ? list.map(c=>{
    const u=c.author||{id:"?",name:"Unknown"};
    const n=u.is_anonymous?`Anonymous <span class="badge">${esc(u.handle||"anon")}</span>`:esc(u.name);
    return `<div class="citem">
      <button data-go="#/profile/${u.id}" style="border:none;background:none;padding:0">${avatarHTML(u,"sm")}</button>
      <div class="cbubble"><div class="n">${n}</div><div class="t">${esc(c.text)}</div></div></div>`;
  }).join("") : `<div class="pmuted" style="margin-bottom:8px">Koi comment nahi. Pehla comment tum karo.</div>`;
}

/* ============================================================
   COMPOSER
   ============================================================ */
let cType="text", cPendingFiles=[];
function wireComposer(){
  document.querySelectorAll("[data-ctype]").forEach(b=>{
    b.onclick=()=>{
      cType=b.getAttribute("data-ctype");
      document.querySelectorAll("[data-ctype]").forEach(x=>x.classList.toggle("active",x===b));
      const lbl=document.getElementById("cFileText"), inp=document.getElementById("cFile");
      if(cType==="photo"){ lbl.textContent="Attach photos"; inp.accept="image/*"; inp.multiple=true; }
      else if(cType==="video"){ lbl.textContent="Attach video"; inp.accept="video/*"; inp.multiple=false; }
      else if(cType==="pdf"){ lbl.textContent="Attach PDF"; inp.accept="application/pdf"; inp.multiple=false; }
      else { lbl.textContent="Attach photo"; inp.accept="image/*"; inp.multiple=true; }
      clearPreview();
    };
  });
  const file=document.getElementById("cFile");
  file.onchange=()=>{
    const fs=Array.from(file.files||[]);
    if(!fs.length) return;
    if(fs.some(f=>f.size>50*1024*1024)){ toast("Ek file 50 MB se badi hai"); file.value=""; return; }
    cPendingFiles=(cType==="photo"||cType==="text")?fs.slice(0,10):[fs[0]];
    renderPreview();
  };
}
function renderPreview(){
  const prev=document.getElementById("cPreview");
  if(!prev) return;
  if(!cPendingFiles.length){ prev.style.display="none"; prev.innerHTML=""; return; }
  prev.style.display="block";
  const first=cPendingFiles[0];
  const isPdf = first.type==="application/pdf" || /\.pdf$/i.test(first.name||"");
  let inner="";
  if(first.type.startsWith("video")) inner=`<video src="${URL.createObjectURL(first)}" controls></video>`;
  else if(isPdf) inner=`<div class="thumbs"><div class="pchip"><span class="pdfthumb" id="cPdfThumb"></span><span>📄 ${esc(first.name)}</span></div></div>`;
  else inner=`<div class="thumbs">${cPendingFiles.map(f=>`<img src="${URL.createObjectURL(f)}" />`).join("")}</div>`;
  prev.innerHTML=`<button class="x" id="cClear">×</button>${inner}`;
  document.getElementById("cClear").onclick=()=>{ clearPreview(); const fi=document.getElementById("cFile"); if(fi) fi.value=""; };
  if(isPdf){ const tb=document.getElementById("cPdfThumb"); if(tb) pdfThumb(first, tb); }
}
async function pdfThumb(file, box){
  try{
    if(!window.pdfjsLib) return;
    window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const buf=await file.arrayBuffer();
    const doc=await window.pdfjsLib.getDocument({data:buf}).promise;
    const page=await doc.getPage(1);
    const vp=page.getViewport({scale:0.35});
    const canvas=document.createElement("canvas");
    canvas.width=Math.floor(vp.width); canvas.height=Math.floor(vp.height);
    box.innerHTML=""; box.appendChild(canvas);
    await page.render({canvasContext:canvas.getContext("2d"), viewport:vp}).promise;
  }catch(e){ /* thumbnail optional */ }
}
function clearPreview(){ cPendingFiles=[]; const p=document.getElementById("cPreview"); if(p){ p.style.display="none"; p.innerHTML=""; } }

async function createPost(){
  if(!user){ toast("Pehle sign in karo"); go("/login"); render(); return; }
  const text=(document.getElementById("cText").value||"").trim();
  if(!text && !cPendingFiles.length){ toast("Kuch likho ya file lagao"); return; }
  const aid=attempt("create_post", { kind: cPendingFiles.length? cType : "text", files: cPendingFiles.length });
  let media=[], type="text", media_url=null, media_path=null;
  if(cPendingFiles.length){
    toast("Upload ho raha hai…");
    for(const f of cPendingFiles){
      const ext=(f.name.split(".").pop()||"bin").toLowerCase().slice(0,5);
      const path=`${user.id}/${crypto.randomUUID()}.${ext}`;
      const up=await sb.storage.from("media").upload(path, f, {cacheControl:"3600", upsert:false});
      if(up.error){ console.error(up.error); diagError("media_upload_result", up.error.message, {outcome:"failed"}); attemptFail(aid, up.error.message, {stage:"upload"}); toast("Upload fail: "+up.error.message); return; }
      const url=sb.storage.from("media").getPublicUrl(path).data.publicUrl;
      const kind=(f.type==="application/pdf"||ext==="pdf")?"pdf":(f.type.startsWith("video")?"video":"image");
      media.push({url, path, kind});
    }
    const kinds=media.map(m=>m.kind);
    if(kinds.includes("pdf")) type="pdf";
    else if(kinds.includes("video")) type="video";
    else type = media.length>1 ? "carousel" : "photo";
    media_url=media[0].url; media_path=media[0].path;
  }
  let ins=await sb.from("posts").insert({ author:user.id, type, text, media_url, media_path, media });
  if(ins.error && /media/i.test(ins.error.message||"")){
    diagLog("post_insert_retry", {reason:"media column missing"});
    ins=await sb.from("posts").insert({ author:user.id, type, text, media_url, media_path });
  }
  const error=ins.error;
  if(error){ console.error(error); diagError("post_create_result", error.message, {outcome:"failed"}); attemptFail(aid, error.message, {stage:"insert"}); toast("Post fail: "+error.message); return; }
  dinfo("post_create_result", { outcome:"success", type, media_count:media.length });
  attemptOk(aid, { type, media_count:media.length });
  trackConversion("create_post", media.length||null, "feed");
  clearPreview();
  toast("Posted! 🎉");
  go("/feed");
  await loadFeed();
}

/* ============================================================
   CAROUSEL + PDF READER
   ============================================================ */
function wireCarousels(){
  document.querySelectorAll("[data-carousel]").forEach(c=>{
    const track=c.querySelector(".track");
    if(!track) return;
    const dots=[...c.querySelectorAll(".dots .dot")];
    const cur=c.querySelector(".cur");
    track.addEventListener("scroll", ()=>{
      const i=Math.round(track.scrollLeft / Math.max(track.clientWidth,1));
      dots.forEach((d,di)=>d.classList.toggle("on", di===i));
      if(cur) cur.textContent=(i+1);
    }, {passive:true});
  });
  hydratePdfThumbs();
}
async function hydratePdfThumbs(){
  const nodes=[...document.querySelectorAll("[data-pdfthumb]")];
  for(const n of nodes){
    if(n.dataset.done) continue;
    n.dataset.done="1";
    const url=n.getAttribute("data-pdfthumb");
    if(!url) continue;
    try{
      if(!window.pdfjsLib) continue;
      window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const doc=await window.pdfjsLib.getDocument(url).promise;
      const page=await doc.getPage(1);
      const vp=page.getViewport({scale:0.6});
      const canvas=document.createElement("canvas");
      canvas.width=Math.floor(vp.width); canvas.height=Math.floor(vp.height);
      n.innerHTML=""; n.appendChild(canvas);
      await page.render({canvasContext:canvas.getContext("2d"), viewport:vp}).promise;
    }catch(e){ /* preview optional — icon rahega */ }
  }
}

let pdfDoc=null, pdfPageNo=1;
async function openPdfReader(url){
  if(!url) return;
  dinfo("pdf_view_result", { outcome:"open" });
  const ov=document.getElementById("pdfReader");
  ov.classList.add("show");
  pdfPageNo=1; pdfDoc=null;
  document.getElementById("pdfPage").textContent="1";
  document.getElementById("pdfCount").textContent="–";
  document.getElementById("pdfCanvasWrap").innerHTML='<div class="pmuted" style="padding:30px">PDF load ho raha hai…</div>';
  try{
    if(!window.pdfjsLib){ pdfFallback(url); return; }
    window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    pdfDoc=await window.pdfjsLib.getDocument(url).promise;
    document.getElementById("pdfCount").textContent=pdfDoc.numPages;
    await renderPdfPage();
  }catch(err){ console.error(err); diagError("pdf_view_result", (err&&err.message)||"render failed", {outcome:"failed"}); pdfFallback(url); }
}
function pdfFallback(url){
  const wrap=document.getElementById("pdfCanvasWrap");
  wrap.innerHTML=`<iframe class="pdf-frame" src="${esc(url)}" title="PDF document"></iframe>`;
  document.getElementById("pdfCount").textContent="–";
}
async function renderPdfPage(){
  if(!pdfDoc) return;
  const page=await pdfDoc.getPage(pdfPageNo);
  const wrap=document.getElementById("pdfCanvasWrap");
  const avail=Math.min((wrap.clientWidth||window.innerWidth)-24, 900);
  const base=page.getViewport({scale:1});
  const scale=Math.max(avail/base.width, 0.5);
  const vp=page.getViewport({scale});
  const canvas=document.createElement("canvas");
  canvas.width=Math.floor(vp.width); canvas.height=Math.floor(vp.height);
  canvas.className="pdf-canvas";
  wrap.innerHTML=""; wrap.appendChild(canvas);
  await page.render({canvasContext:canvas.getContext("2d"), viewport:vp}).promise;
  document.getElementById("pdfPage").textContent=pdfPageNo;
}
function pdfNext(){ if(pdfDoc && pdfPageNo<pdfDoc.numPages){ pdfPageNo++; renderPdfPage(); } }
function pdfPrev(){ if(pdfDoc && pdfPageNo>1){ pdfPageNo--; renderPdfPage(); } }
function closePdf(){ document.getElementById("pdfReader").classList.remove("show"); pdfDoc=null; }

/* reader controls + swipe (right-to-left swipe = next page) */
document.getElementById("pdfClose").onclick=closePdf;
document.getElementById("pdfNext").onclick=pdfNext;
document.getElementById("pdfPrev").onclick=pdfPrev;
(function(){
  const ov=document.getElementById("pdfReader");
  let sx=0, sy=0, active=false;
  ov.addEventListener("touchstart", e=>{ if(e.touches.length!==1) return; sx=e.touches[0].clientX; sy=e.touches[0].clientY; active=true; }, {passive:true});
  ov.addEventListener("touchend", e=>{
    if(!active) return; active=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)){ if(dx<0) pdfNext(); else pdfPrev(); }
  }, {passive:true});
})();
document.addEventListener("keydown", e=>{
  const ov=document.getElementById("pdfReader");
  if(!ov.classList.contains("show")) return;
  if(e.key==="ArrowRight"||e.key==="ArrowDown") pdfNext();
  if(e.key==="ArrowLeft"||e.key==="ArrowUp") pdfPrev();
  if(e.key==="Escape") closePdf();
});
window.addEventListener("resize", ()=>{ const ov=document.getElementById("pdfReader"); if(ov.classList.contains("show") && pdfDoc) renderPdfPage(); });

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.addEventListener("click", async (e)=>{
  const goEl=e.target.closest("[data-go]"); if(goEl){ go(goEl.getAttribute("data-go")); return; }
  const tabEl=e.target.closest("[data-tab]"); if(tabEl){ loginTab=tabEl.getAttribute("data-tab"); viewLogin(); return; }
  const actEl=e.target.closest("[data-act]"); if(!actEl) return;
  const act=actEl.getAttribute("data-act"), id=actEl.getAttribute("data-id");

  if(act==="signout") return signOut();

  if(act==="login-github"){
    formSubmit("login_github","github");
    const { error }=await sb.auth.signInWithOAuth({ provider:"github", options:{ redirectTo: location.href.split("#")[0] } });
    if(error) toast(error.message);
    return;
  }
  if(act==="email-send"){
    const email=(document.getElementById("fEmail").value||"").trim();
    if(!email.includes("@")) return toast("Sahi email daalo");
    formSubmit("login_email","email");
    dinfo("funnel_login_method", {method:"email"});
    const { error }=await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } });
    if(error) return toast(error.message);
    pending.email=email;
    document.getElementById("emailStep2").style.display="block";
    toast("Code email ho gaya ✉️");
    return;
  }
  if(act==="email-verify"){
    const token=(document.getElementById("fCode").value||"").trim();
    const a=attempt("login_email_otp");
    const { error }=await sb.auth.verifyOtp({ email:pending.email, token, type:"email" });
    if(error){ attemptFail(a, error.message); return toast(error.message); }
    attemptOk(a); return;
  }
  if(act==="phone-send"){
    const phone=(document.getElementById("fPhone").value||"").trim();
    if(phone.length<8) return toast("Sahi number daalo");
    formSubmit("login_phone","phone");
    dinfo("funnel_login_method", {method:"phone"});
    const { error }=await sb.auth.signInWithOtp({ phone });
    if(error) return toast(error.message);
    pending.phone=phone;
    document.getElementById("phoneStep2").style.display="block";
    toast("OTP bhej diya 📱");
    return;
  }
  if(act==="phone-verify"){
    const token=(document.getElementById("fOtp").value||"").trim();
    const a=attempt("login_phone_otp");
    const { error }=await sb.auth.verifyOtp({ phone:pending.phone, token, type:"sms" });
    if(error){ attemptFail(a, error.message); return toast(error.message); }
    attemptOk(a); return;
  }
  if(act==="login-anon"){
    formSubmit("login_anon","anon");
    const a=attempt("login_anonymous"); dinfo("funnel_login_method", {method:"anonymous"});
    const { error }=await sb.auth.signInAnonymously();
    if(error){ attemptFail(a, error.message); return toast("Anonymous login band hai — Supabase me enable karo"); }
    attemptOk(a); return;
  }

  if(act==="open-pdf") return openPdfReader(actEl.getAttribute("data-url"));

  if(act==="toggle-diag") return setDiag(!diag.enabled);
  if(act==="diag-refresh"){ diagLog("diag_refresh"); toast("Refresh ho gaya"); return render(); }
  if(act==="diag-clean"){ if(!confirm("Saare logs delete karein?")) return; diag.logs=[]; localStorage.removeItem(DIAG_LOGS_KEY); toast("Logs clean 🧹"); return render(); }
  if(act==="diag-copy"){ diagLog("diag_copy"); try{ await navigator.clipboard.writeText(fmtTxt(diagReport())); toast("Report copy ho gaya 📋"); }catch(err){ toast("Copy fail"); } return; }
  if(act==="diag-email") return diagEmail();
  if(act==="diag-share") return diagShare("txt");
  if(act==="diag-csv") return downloadFile(diagFile("csv").name, diagFile("csv").text, diagFile("csv").mime);
  if(act==="diag-json") return downloadFile(diagFile("json").name, diagFile("json").text, diagFile("json").mime);
  if(act==="diag-md") return downloadFile(diagFile("md").name, diagFile("md").text, diagFile("md").mime);
  if(act==="diag-txt") return downloadFile(diagFile("txt").name, diagFile("txt").text, diagFile("txt").mime);
  if(act==="diag-filter"){ diag.filter=actEl.getAttribute("data-level")||"all"; return render(); }
  if(act==="notion-sync-now"){ if(!notionReady()){ toast("Notion sync off hai"); return; } toast("Sync kar raha hoon…"); notionSend("manual"); setTimeout(()=>render(), 3000); return; }
  if(act==="fb-rate"){ diag.fb=Number(actEl.getAttribute("data-rate"))||null; toast("Rating "+diag.fb+"★"); return render(); }
  if(act==="fb-submit"){ const ta=document.getElementById("fbText"); const t=(ta&&ta.value)||""; dinfo("feedback_submitted", { rating:diag.fb, page:screenName(), comment_len:t.trim().length }); toast("Feedback bhej diya 🙏"); diag.fb=null; return render(); }

  if(act==="post") return createPost();

  if(act==="like"){
    if(!user){ toast("Like karne ke liye sign in karo"); go("/login"); render(); return; }
    const liked=myLikes.has(id);
    dinfo("post_like_result", { post_id:id, outcome: liked?"unliked":"liked" });
    if(liked){
      myLikes.delete(id);
      await sb.from("likes").delete().eq("post_id",id).eq("user_id",user.id);
    } else {
      myLikes.add(id);
      await sb.from("likes").insert({ post_id:id, user_id:user.id });
    }
    await loadFeed();
    return;
  }
  if(act==="toggle-comments"){
    const box=document.querySelector(`[data-comments="${id}"]`);
    if(!box) return;
    const open=box.classList.toggle("open");
    if(open) loadComments(id);
    return;
  }
  if(act==="comment"){
    if(!user){ toast("Comment ke liye sign in karo"); go("/login"); render(); return; }
    const input=document.querySelector(`[data-cinput="${id}"]`);
    const text=(input.value||"").trim(); if(!text) return;
    const { error }=await sb.from("comments").insert({ post_id:id, author:user.id, text });
    if(error){ diagError("comment_submit_result", error.message, {outcome:"failed"}); return toast(error.message); }
    dinfo("comment_submit_result", { post_id:id, outcome:"success" });
    input.value="";
    const p=posts.find(x=>x.id===id);
    if(p && p.comments && p.comments[0]) p.comments[0].count++;
    const box=document.querySelector(`[data-comments="${id}"]`);
    if(box){ box.classList.add("open"); }
    loadComments(id);
    return;
  }
  if(act==="share"){
    const link=location.href.split("#")[0]+"#/post/"+id;
    try{
      if(navigator.share) await navigator.share({title:"Pulse post", text:"Ye post dekho", url:link});
      else { await navigator.clipboard.writeText(link); toast("Link copied! 🔗"); }
    }catch(err){}
    return;
  }
  if(act==="delete"){
    if(!user) return;
    if(!confirm("Ye post delete karein?")) return;
    const p=posts.find(x=>x.id===id);
    if(p){
      const paths=(Array.isArray(p.media)&&p.media.length)?p.media.map(m=>m.path).filter(Boolean):(p.media_path?[p.media_path]:[]);
      if(paths.length){ try{ await sb.storage.from("media").remove(paths); }catch(e){} }
    }
    const { error }=await sb.from("posts").delete().eq("id",id);
    if(error) return toast(error.message);
    toast("Post delete ho gaya"); await loadFeed();
    return;
  }
  if(act==="edit-profile") return openEdit();
});

document.addEventListener("keydown", (e)=>{
  if(e.key==="Enter" && e.target.matches("[data-cinput]")){
    e.preventDefault();

function openEdit(){
  if(!profile) return;
  document.getElementById("edName").value=profile.name||"";
  document.getElementById("edBio").value=profile.bio||"";
  document.getElementById("edEmoji").value=profile.emoji||"";
  document.getElementById("editModal").classList.add("show");
}
document.getElementById("edCancel").onclick=()=>document.getElementById("editModal").classList.remove("show");
document.getElementById("edSave").onclick=async ()=>{
  if(!profile) return;
  const patch={
    name:(document.getElementById("edName").value||"").trim()||profile.name,
    bio:(document.getElementById("edBio").value||"").trim(),
    emoji:(document.getElementById("edEmoji").value||"").trim()
  };

  if(error) return toast(error.message);
  profile=data; document.getElementById("editModal").classList.remove("show");
  toast("Profile update ho gaya"); render();
};

/* ============================================================
   BOOT
   ============================================================ */
(async function boot(){
  dinfo("session_start", { start_type:"warm", app_version:APP_VERSION });
  if(!CONFIGURED){ viewSetup(); return; }
  const { data:{ session } }=await sb.auth.getSession();
  user=session?session.user:null;
  if(user) await ensureProfile();
  if(user) await setUserHash(user.id);
  render();
  if(user) loadFeed();
  capturePermissions();
  sb.auth.onAuthStateChange(async (event, s)=>{
    dinfo("auth_state_change", { outcome:"event", auth_event:event });
    if(event==="SIGNED_IN" && s && (!user || user.id!==s.user.id)){ user=s.user; await setUserHash(s.user.id); dinfo("auth_state_change", {outcome:"signed_in", method:s.user.is_anonymous?"anonymous":"identity"}); trackConversion("sign_in", null, s.user.is_anonymous?"anonymous":"identity"); await afterAuth(); }
    if(event==="SIGNED_OUT"){ user=null; profile=null; setUserHash(null); dinfo("auth_state_change", {outcome:"signed_out"}); render(); }
  });
})();
