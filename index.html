/* ---------- messages ---------- */
function chatMsgHTML(m, urls){
  const mine = m.sender === user.id;
  const att = m.attachment;
  let inner = m.body ? `<div class="cbody">${linkify(m.body)}</div>` : "";
  if(att && att.path){
    const u = urls[att.path] || "";
    const k = att.kind || "file";
    if(!u) inner += `<div class="cfile">📎 ${esc(att.name || k)}</div>`;
    else if(k === "image") inner += `<a href="${esc(u)}" target="_blank" rel="noopener"><img class="cimg" src="${esc(u)}" alt="image" loading="lazy" /></a>`;
    else if(k === "video") inner += `<video class="cvid" src="${esc(u)}" controls playsinline></video>`;
    else if(k === "audio") inner += `<audio src="${esc(u)}" controls></audio>`;
    else inner += `<a class="cfile" href="${esc(u)}" target="_blank" rel="noopener">📎 ${esc(att.name || k)}</a>`;
  }
  return `<div class="cmsg ${mine ? "mine" : "theirs"}"><div class="cbubble2">${inner}
    <div class="ctime">${mine ? "You" : "Them"} · ${String(m.created_at).slice(11,16)}</div></div></div>`;
}

async function loadChatMessages(chatId){
  const box = document.getElementById("chatMsgs");
  if(!box || activeChatId !== chatId) return;
  const { data } = await sb.from("chat_messages")
    .select("id,sender,body,attachment,created_at")
    .eq("chat_id", chatId).order("created_at", { ascending:true }).limit(500);
  const list = data || [];
  const paths = list.filter(m => m.attachment && m.attachment.path).map(m => m.attachment.path);
  const urls = {};
  if(paths.length){
    try{
      const { data:s } = await sb.storage.from(CHAT_BUCKET).createSignedUrls(paths, 3600);
      (s || []).forEach(x => { if(x && x.signedUrl) urls[x.path] = x.signedUrl; });
    }catch(e){}
  }
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.innerHTML = list.length
    ? list.map(m => chatMsgHTML(m, urls)).join("")
    : `<div class="pmuted" style="padding:18px;text-align:center">Koi message nahi. Pehla message bhejo.</div>`;
  if(atBottom) box.scrollTop = box.scrollHeight;
}

async function sendChatMessage(chatId){
  const inp = document.getElementById("chatText");
  const txt = ((inp && inp.value) || "").trim();
  if(!txt) return;
  inp.value = "";
  const { error } = await sb.from("chat_messages").insert({ chat_id:chatId, sender:user.id, body:txt.slice(0,4000) });
  if(error){ toast(friendlyError(error, "Message nahi gaya")); return; }
  dAct("chat_message_sent", "Message bheja", { chat_id:chatId, len:txt.length });
  loadChatMessages(chatId);
}

async function sendChatFile(chatId, file){
  if(!file) return;
  if(file.size > 50 * 1024 * 1024) return toast("File 50 MB se badi hai");
  toast("Upload ho raha hai…");
  const ext = (file.name.split(".").pop() || "bin").toLowerCase().slice(0,5);
  const path = chatId + "/" + crypto.randomUUID() + "." + ext;
  const up = await sb.storage.from(CHAT_BUCKET).upload(path, file, { cacheControl:"3600", upsert:false });
  if(up.error) return toast(friendlyError(up.error, "Upload fail"));
  const kind = file.type.startsWith("image/") ? "image"
             : file.type.startsWith("video/") ? "video"
             : file.type.startsWith("audio/") ? "audio"
             : (file.type === "application/pdf" || ext === "pdf") ? "pdf" : "file";
  const { error } = await sb.from("chat_messages").insert({
    chat_id:chatId, sender:user.id, body:"",
    attachment:{ path, kind, name:file.name, size:file.size, mime:file.type }
  });
  if(error) return toast(friendlyError(error, "File message nahi gaya"));
  dAct("chat_file_sent", "File bheji", { chat_id:chatId, kind, size:file.size });
  loadChatMessages(chatId);
}

function wireChatRoom(ch){
  const id = ch.id;
  callChannel(id);   /* incoming calls receive karne ke liye */
  if(ch.kind === "group" && ch.created_by === user.id){
    sb.from("chat_keys").select("key").eq("chat_id", id).eq("kind", "group").limit(1).maybeSingle()
      .then(({ data }) => {
        const w = document.getElementById("groupKeyWrap");
        if(w && data && data.key){
          w.innerHTML = `<div class="card"><div style="font-weight:600;font-size:13px;margin-bottom:6px">Group key — isse log join karenge</div>
            <div class="keybox"><span class="keytxt">${esc(data.key)}</span>
            <button class="btn sm" data-act="chat-copy-key" data-key="${esc(data.key)}">Copy</button></div></div>`;
        }
      });
  }
  loadChatMessages(id);
  const inp = document.getElementById("chatText");
  if(inp){
    inp.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); sendChatMessage(id); } };
    inp.focus();
  }
  const f = document.getElementById("chatFile");
  if(f) f.onchange = async () => { const file = f.files && f.files[0]; f.value = ""; if(file) await sendChatFile(id, file); };

  clearInterval(chatPollTimer);
  chatPollTimer = setInterval(() => {
    if(activeChatId !== id) return;
    if(ch.expires_at && Date.parse(ch.expires_at) <= Date.now()){
      clearInterval(chatPollTimer); chatPollTimer = null; render(); return;
    }
    loadChatMessages(id);
  }, 4000);

  try{
    if(chatSub){ sb.removeChannel(chatSub); chatSub = null; }
    chatSub = sb.channel("chat:" + id)
      .on("postgres_changes", { event:"INSERT", schema:"public", table:"chat_messages", filter:"chat_id=eq." + id },
        () => loadChatMessages(id))
      .subscribe();
  }catch(e){}
}

/* ============================================================
   CALLS v2 — mesh group calls + global ring + ringtone
   - 1:1 aur group dono (har peer ke saath alag RTCPeerConnection)
   - ring apni personal channel pe aati hai → chat khuli ho ya na ho
   - STUN + TURN (custom TURN Settings se set hota hai)
   ============================================================ */
const STUN_SERVERS = [
  { urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }
];
const DEFAULT_TURN = [
  { urls: "turn:openrelay.metered.ca:80",  username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
];
function customTurn(){
  try{ const v = JSON.parse(localStorage.getItem("pulse_turn") || "[]"); return Array.isArray(v) ? v : []; }
  catch(e){ return []; }
}
function turnServers(){ const c = customTurn(); return c.length ? c : DEFAULT_TURN; }
function iceConfig(){
  return { iceServers: [...STUN_SERVERS, ...turnServers()], iceCandidatePoolSize: 2 };
}

/* ---------- self test ---------- */
function testMic(){

      s.getTracks().forEach(t => t.stop());
      res({ ok:true });
    }).catch(e => res({ ok:false, error:(e && (e.name || e.message)) || "denied" }));

function testCamera(){

    navigator.mediaDevices.getUserMedia({ video:true }).then(s => {
      s.getTracks().forEach(t => t.stop());
      res({ ok:true });
    }).catch(e => res({ ok:false, error:(e && (e.name || e.message)) || "denied" }));

}
function testRealtime(){
  return new Promise(res => {
    let done = false;
    const name = "selftest:" + Math.random().toString(36).slice(2, 8);
    const ch = sb.channel(name, { config:{ broadcast:{ self:false } } });
    const t = setTimeout(() => { if(!done){ done = true; try{ sb.removeChannel(ch); }catch(e){} res({ ok:false, status:"TIMEOUT" }); } }, 9000);
    ch.subscribe(st => {
      if(done) return;
      if(st === "SUBSCRIBED"){ done = true; clearTimeout(t); try{ sb.removeChannel(ch); }catch(e){} res({ ok:true, status:st }); }
      else if(st === "CHANNEL_ERROR" || st === "TIMED_OUT"){ done = true; clearTimeout(t); try{ sb.removeChannel(ch); }catch(e){} res({ ok:false, status:st }); }

}
let _callTest = null;

const callState = {
  peers: new Map(),        /* userId -> { pc, videoEl } */
  local: null,
  chan: null, ringChan: null,
  chatId: null, callId: null,
  video: false, active: false, isCaller: false,
  pending: new Map(),      /* userId -> [candidates] */
  remoteSet: new Map(),    /* userId -> bool */
  seen: new Set(),         /* ring dedupe */
  chanReady: false,
  outbox: []
};

/* ---------- ringtone ---------- */
let _ringTimer = null, _ringCtx = null;
function startRingtone(){
  try{
    stopRingtone();
    _ringCtx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = () => {
      if(!_ringCtx) return;
      const t = _ringCtx.currentTime;
      const o = _ringCtx.createOscillator(), g = _ringCtx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g); g.connect(_ringCtx.destination);
      o.start(t); o.stop(t + 0.55);
    };
    beep();
    _ringTimer = setInterval(beep, 1300);
    if(navigator.vibrate) navigator.vibrate([400, 300, 400, 300]);
  }catch(e){}
}
function stopRingtone(){
  clearInterval(_ringTimer); _ringTimer = null;
  try{ if(_ringCtx) _ringCtx.close(); }catch(e){}
  _ringCtx = null;
  try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}
}

/* ---------- overlay ---------- */
function callOverlay(){
  let ov = document.getElementById("callOverlay");
  if(ov) return ov;
  ov = document.createElement("div");
  ov.id = "callOverlay"; ov.className = "callov";
  ov.innerHTML = `
    <div id="callVideos" class="callvids"></div>
    <video id="callLocal" autoplay playsinline muted></video>
    <div class="calltop"><span id="callStatus">Connecting…</span> <span id="callCount" class="callcnt"></span></div>
    <div class="callbar">
      <button class="cbtn" id="callMute" aria-label="Mute">🎤</button>
      <button class="cbtn" id="callCam" aria-label="Camera">🎥</button>
      <button class="cbtn end" id="callEnd" aria-label="End">✕</button>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector("#callEnd").onclick = () => endCall(true);
  ov.querySelector("#callMute").onclick = () => {
    const a = callState.local && callState.local.getAudioTracks()[0];
    if(!a) return;
    a.enabled = !a.enabled;
    ov.querySelector("#callMute").classList.toggle("off", !a.enabled);
  };
  ov.querySelector("#callCam").onclick = () => {
    const v = callState.local && callState.local.getVideoTracks()[0];
    if(!v) return;
    v.enabled = !v.enabled;
    ov.querySelector("#callCam").classList.toggle("off", !v.enabled);
  };
  return ov;
}
function callVideoEl(userId){
  const box = document.getElementById("callVideos");
  if(!box) return null;
  let v = box.querySelector('[data-vid="' + userId + '"]');
  if(!v){
    v = document.createElement("video");
    v.dataset.vid = userId;
    v.autoplay = true; v.playsInline = true;
    v.className = "callvid";
    box.appendChild(v);
    layoutVideos();
  }
  return v;
}
function layoutVideos(){
  const box = document.getElementById("callVideos");
  if(!box) return;
  const n = box.children.length;
  box.style.gridTemplateColumns = n <= 1 ? "1fr" : "1fr 1fr";
  const c = document.getElementById("callCount");
  if(c) c.textContent = n > 1 ? "(" + (n + 1) + " log)" : "";
}
function showCallUI(video){
  const ov = callOverlay();
  ov.classList.add("show");
  const lv = ov.querySelector("#callLocal");
  if(lv){ lv.srcObject = callState.local; lv.style.display = video ? "block" : "none"; }
  const cam = ov.querySelector("#callCam");
  if(cam) cam.style.display = video ? "" : "none";
  const st = ov.querySelector("#callStatus");
  if(st) st.textContent = callState.isCaller ? "Ringing…" : "Connecting…";
}
function setStatus(t){ const s = document.getElementById("callStatus"); if(s) s.textContent = t; }

/* ---------- channels ---------- */
function callChannel(chatId){
  if(callState.chan && callState.chatId === chatId) return callState.chan;
  try{ if(callState.chan) sb.removeChannel(callState.chan); }catch(e){}
  const ch = sb.channel("call:" + chatId, { config: { broadcast: { self: false } } });
  ch.on("broadcast", { event: "call" }, ({ payload }) => onCallSignal(payload));
  callState.chanReady = false;
  callState.outbox = [];
  ch.subscribe((st) => {
    dcat("app", "info", "call_channel_state", "Realtime: " + st, { chat_id: chatId, state: st });
    if(st === "SUBSCRIBED"){
      callState.chanReady = true;
      const q = callState.outbox.splice(0);
      q.forEach(pl => { try{ ch.send({ type:"broadcast", event:"call", payload: pl }); }catch(e){} });
    }
    if(st === "CHANNEL_ERROR" || st === "TIMED_OUT"){
      setStatus("Realtime connect nahi hua (" + st + ")");
    }
  });
  callState.chan = ch; callState.chatId = chatId;
  return ch;
}
function ringChannel(){
  if(!user) return null;
  if(callState.ringChan) return callState.ringChan;
  const ch = sb.channel("ring:" + user.id, { config: { broadcast: { self: false } } });
  ch.on("broadcast", { event: "ring" }, ({ payload }) => handleRing(payload));
  ch.subscribe();
  callState.ringChan = ch;
  return ch;
}
function sendSignal(obj, to){
  const ch = callState.chan;
  if(!ch) return;
  const payload = Object.assign({ from: user.id, to: to || null, callId: callState.callId, at: Date.now() }, obj);
  if(callState.chanReady){
    try{ ch.send({ type:"broadcast", event:"call", payload }); }catch(e){}
  } else {
    callState.outbox.push(payload);   /* subscribe hone se pehle → queue */
  }
}
function sendRing(toUserId, chatId, video){
  try{
    const ch = sb.channel("ring:" + toUserId, { config: { broadcast: { self: false } } });
    ch.subscribe((st) => {
      if(st === "SUBSCRIBED"){
        ch.send({ type:"broadcast", event:"ring",
          payload:{ from: user.id, chatId, video:!!video, callId: callState.callId, at: Date.now() } });
        setTimeout(() => { try{ sb.removeChannel(ch); }catch(e){} }, 1500);
      }
    });
  }catch(e){}
}

/* ---------- peer management ---------- */
function newPeer(userId){
  const pc = new RTCPeerConnection(iceConfig());
  const el = callVideoEl(userId);
  callState.pending.set(userId, []);
  callState.remoteSet.set(userId, false);

  pc.onicecandidate = e => { if(e.candidate) sendSignal({ kind:"ice", candidate:e.candidate }, userId); };
  pc.ontrack = e => {
    const v = callVideoEl(userId);
    if(v && e.streams && e.streams[0]){
      v.srcObject = e.streams[0];
      const p = v.play(); if(p && p.catch) p.catch(() => {});
    }
  };
  pc.onconnectionstatechange = () => {
    if(pc.connectionState === "connected"){ setStatus("Connected"); reportCallQuality(); }
    if(pc.connectionState === "failed"){
      try{ pc.restartIce(); }catch(e){}
      setStatus("Connection fail — network/TURN check karo");
    }
  };
  if(callState.local) callState.local.getTracks().forEach(t => pc.addTrack(t, callState.local));
  callState.peers.set(userId, { pc, el });
  return pc;
}
function dropPeer(userId){
  const p = callState.peers.get(userId);
  if(p){ try{ p.pc.close(); }catch(e){} if(p.el) p.el.remove(); }
  callState.peers.delete(userId);
  callState.pending.delete(userId);
  callState.remoteSet.delete(userId);
  layoutVideos();
}

async function reportCallQuality(){
  try{
    for(const [uid, p] of callState.peers){
      const stats = await p.pc.getStats();
      let localType = null;
      stats.forEach(r => {
        if(r.type === "candidate-pair" && r.state === "succeeded" && r.nominated){
          const l = stats.get(r.localCandidateId); if(l) localType = l.candidateType;
        }
      });
      dcat("performance", "info", "call_quality", "Peer " + (localType === "relay" ? "TURN" : "P2P"),
        { relay_used: localType === "relay", local_candidate: localType, peers: callState.peers.size });
      if(localType === "relay") setStatus("Connected (TURN)");
      break;
    }
  }catch(e){}
}

/* ---------- start / accept / end ---------- */
async function peerIdsFor(chatId){
  try{
    const { data } = await sb.from("chat_members").select("user_id").eq("chat_id", chatId);
    return (data || []).map(r => r.user_id).filter(id => id !== user.id);
  }catch(e){ return []; }
}

async function startCall(chatId, video){
  if(callState.active) return toast("Pehle se call chal rahi hai");
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast("Is browser me calling support nahi hai");
  try{
    callState.local = await navigator.mediaDevices.getUserMedia({
      audio: true, video: video ? { width:{ideal:1280}, height:{ideal:720} } : false
    });
  }catch(e){ return toast("Mic/camera permission nahi mili"); }

  callState.video = !!video;
  callState.active = true;
  callState.isCaller = true;
  callState.callId = "c_" + Math.random().toString(36).slice(2, 10);
  callState.peers.clear(); callState.pending.clear(); callState.remoteSet.clear();

  callChannel(chatId);
  ringChannel();
  showCallUI(!!video);

  const peers = await peerIdsFor(chatId);
  peers.forEach(pid => sendRing(pid, chatId, video));
  sendSignal({ kind:"ring", video:!!video });   /* jo log chat me hain unko bhi */
  setStatus("Ringing… (" + peers.length + " ko bheja)");
  dcat("app", "info", "call_ring_sent", "Ring bheja", { chat_id: chatId, peers: peers.length, video: !!video });
  dAct("call_started", "Call shuru ki", { chat_id: chatId, video: !!video, peers: peers.length });
}

async function acceptCall(){
  const p = callState.pendingRing;
  hideIncoming();
  stopRingtone();
  if(!p) return;
  try{
    callState.local = await navigator.mediaDevices.getUserMedia({
      audio: true, video: p.video ? { width:{ideal:1280}, height:{ideal:720} } : false
    });
  }catch(e){ return toast("Mic/camera permission nahi mili"); }

  callState.active = true;
  callState.isCaller = false;
  callState.video = !!p.video;
  callState.callId = p.callId;
  callState.pendingRing = null;

  callChannel(p.chatId);
  ringChannel();
  showCallUI(!!p.video);
  sendSignal({ kind:"join", video:!!p.video });
  setStatus("Connecting…");
  dAct("call_accepted", "Call accept ki", { video: !!p.video });

  if(location.hash !== "#/chat/" + p.chatId) go("/chat/" + p.chatId);
}

function endCall(send){
  if(send && callState.active) sendSignal({ kind:"end" });
  for(const uid of [...callState.peers.keys()]) dropPeer(uid);
  try{ if(callState.local) callState.local.getTracks().forEach(t => t.stop()); }catch(e){}
  callState.local = null;
  callState.active = false;
  callState.callId = null;
  callState.pendingRing = null;
  stopRingtone();
  const ov = document.getElementById("callOverlay");
  if(ov) ov.remove();
  hideIncoming();
  dAct("call_ended", "Call khatam", {});
}

/* ---------- incoming ---------- */
function handleRing(p){
  if(!p || !user || p.from === user.id) return;
  if(p.busy){ toast("Doosra user abhi call pe hai"); endCall(false); return; }
  if(p.callId && callState.seen.has(p.callId)) return;
  if(p.callId) callState.seen.add(p.callId);
  if(callState.active){
    try{
      const ch = sb.channel("ring:" + p.from, { config:{ broadcast:{ self:false } } });
      ch.subscribe(st => { if(st === "SUBSCRIBED"){
        ch.send({ type:"broadcast", event:"ring", payload:{ from:user.id, busy:true, callId:p.callId } });
        setTimeout(() => { try{ sb.removeChannel(ch); }catch(e){} }, 1200);
      }});
    }catch(e){}
    return;
  }
  callState.pendingRing = p;
  callState.video = !!p.video;
  showIncoming(p);
  startRingtone();
}

function showIncoming(p){
  let ov = document.getElementById("callIncoming");
  if(!ov){
    ov = document.createElement("div");
    ov.id = "callIncoming"; ov.className = "callin";
    document.body.appendChild(ov);
  }
  ov.innerHTML = `<div class="callinbox">
      <div style="font-size:34px">📞</div>
      <div style="font-weight:700;margin-top:8px">Incoming ${p.video ? "video" : "audio"} call</div>
      <div class="pmuted" style="font-size:13px">Anonymous</div>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn" id="callReject" style="flex:1">Reject</button>
        <button class="btn primary" id="callAccept" style="flex:1">Accept</button>
      </div>
    </div>`;
  ov.style.display = "flex";
  ov.querySelector("#callReject").onclick = () => { sendSignal({ kind:"end" }); hideIncoming(); stopRingtone(); };
  ov.querySelector("#callAccept").onclick = () => acceptCall();
}
function hideIncoming(){
  const ov = document.getElementById("callIncoming");
  if(ov) ov.remove();
  stopRingtone();
}

/* ---------- signalling ---------- */
async function onCallSignal(p){
  if(!p || !user || p.from === user.id) return;
  if(p.to && p.to !== user.id) return;
  if(p.callId && callState.callId && p.callId !== callState.callId && p.kind !== "ring") return;

  if(p.kind === "ring"){ handleRing(p); return; }

  if(p.kind === "join"){
    if(!callState.active) return;
    setStatus("Join mila — offer bhej raha hoon");
    dcat("app", "info", "call_join_received", "Join mila", { peer: p.from });
    /* naya member aaya → usko offer bhejo */
    const pc = callState.peers.get(p.from) ? callState.peers.get(p.from).pc : newPeer(p.from);
    try{
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      sendSignal({ kind:"offer", sdp: pc.localDescription }, p.from);
    }catch(e){ diagError("call_offer_failed", e); }
    return;
  }

  if(p.kind === "offer"){
    if(!callState.active) return;
    setStatus("Offer mila — answer bhej raha hoon");
    const pc = callState.peers.get(p.from) ? callState.peers.get(p.from).pc : newPeer(p.from);
    try{
      await pc.setRemoteDescription(new RTCSessionDescription(p.sdp));
      callState.remoteSet.set(p.from, true);
      const buffered = callState.pending.get(p.from) || [];
      for(const c of buffered){ try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){} }
      callState.pending.set(p.from, []);
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      sendSignal({ kind:"answer", sdp: pc.localDescription }, p.from);
      setStatus("Answer bheja — connecting…");
    }catch(e){ diagError("call_answer_failed", e); }
    return;
  }

  if(p.kind === "answer"){
    const entry = callState.peers.get(p.from);
    if(!entry) return;
    try{
      await entry.pc.setRemoteDescription(new RTCSessionDescription(p.sdp));
      callState.remoteSet.set(p.from, true);
      const buffered = callState.pending.get(p.from) || [];
      for(const c of buffered){ try{ await entry.pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){} }
      callState.pending.set(p.from, []);
    }catch(e){}
    return;
  }

  if(p.kind === "ice"){
    const entry = callState.peers.get(p.from);
    if(entry && callState.remoteSet.get(p.from)){
      try{ await entry.pc.addIceCandidate(new RTCIceCandidate(p.candidate)); }catch(e){}
    } else {
      const arr = callState.pending.get(p.from) || [];
      arr.push(p.candidate); callState.pending.set(p.from, arr);
    }
    return;
  }

  if(p.kind === "end"){
    if(callState.active){
      dropPeer(p.from);
      if(callState.peers.size === 0){ endCall(false); toast("Call khatam ho gayi"); }
    } else {
      hideIncoming();
    }
    return;
  }
}

/* ============================================================
   PHASE 3 — GROUPS (permanent + temp), group keys
   ============================================================ */
async function createGroup(title, seconds){
  if(!user) return;
  title = String(title || "").trim().slice(0, 60);
  if(!title) return toast("Group ka naam daalo");
  seconds = seconds ? Math.floor(Number(seconds)) : 0;
  if(seconds && seconds < 10) return toast("Minimum 10 second");

  const expires = seconds ? new Date(Date.now() + seconds * 1000).toISOString() : null;
  const { data:ch, error } = await sb.from("chats")
    .insert({ kind:"group", title, created_by:user.id, expires_at:expires })
    .select().single();
  if(error) return toast(friendlyError(error, "Group ban nahi paya"));

  const m = await sb.from("chat_members").insert({ chat_id:ch.id, user_id:user.id });
  if(m.error) return toast(friendlyError(m.error, "Group member add nahi hua"));

  const key = newChatKey();
  const k = await sb.from("chat_keys").insert({
    owner:user.id, key, kind:"group", chat_id:ch.id, expires_at:expires
  });
  if(k.error) return toast(friendlyError(k.error, "Group key ban nahi payi"));

  dAudit("group_created", "Group banaya", { chat_id:ch.id, temp:!!seconds });
  toast("Group ban gaya 👥");
  await loadChatKeys();
  go("/chat/" + ch.id);
}

async function joinGroupByKey(k){
  const { data, error } = await sb.rpc("claim_group_key", { p_key:k });
  if(error) return null;
  const row = Array.isArray(data) ? data[0] : data;
  return row || null;
}


/* ============================================================
   BOOT
   ============================================================ */
(async function boot(){
  detectCrash();
  analyticsInit();
  dcat("app","info","session_start", "App start", { start_type:"warm", app_version:APP_VERSION, environment:ENVIRONMENT });
  if(!CONFIGURED){ viewSetup(); return; }
  const { data:{ session } }=await sb.auth.getSession();
  user=session?session.user:null;
  if(user) await ensureProfile();
  if(user) await setUserHash(user.id);
  render();
  loadFeed();          /* logged-out visitors ko bhi public feed dikhna chahiye */
  if(user) ringChannel();   /* global ring — chat khuli ho ya na ho */
  capturePermissions();
  sb.auth.onAuthStateChange(async (event, s)=>{
    dinfo("auth_state_change", { outcome:"event", auth_event:event });
    if(event==="SIGNED_IN" && s && (!user || user.id!==s.user.id)){ user=s.user; await setUserHash(s.user.id); dinfo("auth_state_change", {outcome:"signed_in", method:s.user.is_anonymous?"anonymous":"identity"}); trackConversion("sign_in", null, s.user.is_anonymous?"anonymous":"identity"); await afterAuth(); }
    if(event==="SIGNED_OUT"){ user=null; profile=null; setUserHash(null); dinfo("auth_state_change", {outcome:"signed_out"}); render(); }
  });
})();
</script>
