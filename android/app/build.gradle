plugins { id 'com.android.application' }

android {
    namespace 'uk.merry.pulse'
    compileSdk 34

    defaultConfig {
        applicationId "uk.merry.pulse"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    buildFeatures { buildConfig true }

    def ksPath = System.getenv("PULSE_KEYSTORE") ?: "pulse.keystore"
    def ksFile = rootProject.file(ksPath)

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("PULSE_KS_PASS") ?: "pulsefeed123"
                keyAlias System.getenv("PULSE_KEY_ALIAS") ?: "pulse"
                keyPassword System.getenv("PULSE_KEY_PASS") ?: "pulsefeed123"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
